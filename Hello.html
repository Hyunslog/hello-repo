<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>웨비나 신청 | AI 비즈니스 전략 세미나</title>
  <style>
    :root {
      --bg: #f5f7fc;
      --panel: #ffffff;
      --panel-soft: #edf3ff;
      --primary: #2d5bff;
      --primary-dark: #1e42c7;
      --primary-soft: rgba(45, 91, 255, 0.1);
      --text: #1b2333;
      --muted: #67728b;
      --line: #e4eaf5;
      --success: #0f9d69;
      --success-soft: #eafaf3;
      --shadow: 0 30px 70px rgba(33, 62, 155, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      background: linear-gradient(140deg, #eef4ff 0%, #f8faff 42%, #f5f7fc 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .page {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 28px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(228, 234, 245, 0.9);
      border-radius: 30px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .event {
      position: relative;
      padding: 0;
      background: linear-gradient(180deg, #0f1833 0%, #1b2f68 100%);
      color: #fff;
      overflow: hidden;
    }

    .event::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(120, 162, 255, 0.45), transparent 34%);
      pointer-events: none;
    }

    .event-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 42px 36px 30px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 800;
      width: fit-content;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.06em;
    }

    .lead {
      margin: 0 0 22px;
      max-width: 480px;
      color: rgba(255,255,255,0.82);
      font-size: 1.04rem;
      line-height: 1.75;
    }

    .event-image {
      margin: 16px 0 20px;
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 24px 48px rgba(9, 15, 35, 0.28);
      background: #dfe9ff;
    }

    .event-image img {
      display: block;
      width: 100%;
      height: 290px;
      object-fit: cover;
    }

    .info-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: auto;
    }

    .info-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px 12px;
      min-height: 90px;
    }

    .info-label {
      display: block;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.64);
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .info-value {
      display: block;
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .form-panel {
      background: var(--panel);
      padding: 34px 32px 30px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.1rem);
      letter-spacing: -0.04em;
    }

    .tag {
      padding: 8px 12px;
      background: var(--panel-soft);
      border: 1px solid rgba(45, 91, 255, 0.15);
      color: var(--primary-dark);
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      white-space: nowrap;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      padding: 14px 15px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(45, 91, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(45, 91, 255, 0.08);
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      margin-top: 2px;
    }

    .submit {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      font-size: 1rem;
      font-weight: 800;
      padding: 16px 18px;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(45, 91, 255, 0.24);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(45, 91, 255, 0.28);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status {
      color: var(--success);
      font-weight: 800;
    }

    .success-state {
      display: none;
      min-height: 470px;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 20px;
    }

    .success-box {
      max-width: 420px;
      background: var(--success-soft);
      border: 1px solid rgba(15, 157, 105, 0.18);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 42px rgba(15, 157, 105, 0.1);
    }

    .success-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dff7eb;
      color: var(--success);
      font-size: 2.3rem;
      font-weight: 900;
    }

    .success-box h3 {
      margin: 0 0 10px;
      font-size: 2rem;
      letter-spacing: -0.04em;
      color: #123c2a;
    }

    .success-box p {
      margin: 0;
      color: #3d5d52;
      line-height: 1.7;
      font-size: 1rem;
    }

    .success-box button {
      margin-top: 22px;
      border: none;
      border-radius: 12px;
      background: var(--success);
      color: white;
      font-weight: 800;
      padding: 12px 18px;
      cursor: pointer;
    }

    @media (max-width: 960px) {
      .page {
        grid-template-columns: 1fr;
      }

      .event-inner,
      .form-panel {
        padding: 30px 24px;
      }
    }

    @media (max-width: 560px) {
      .row,
      .info-strip {
        grid-template-columns: 1fr;
      }

      .title-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="event" aria-label="웨비나 이벤트 소개">
      <div class="event-inner">
        <div class="eyebrow">LIVE WEBINAR</div>
        <h1>AI 시대, 고객 경험을 <br>더 빠르게 바꾸는 법</h1>
        <p class="lead">
          실무자들이 바로 사용할 수 있는 AI 활용 전략과 운영 노하우를 전해드립니다.
          마케팅, 서비스, 운영전략까지 한 번에 정리해 드리는 실전 중심 웨비나입니다.
        </p>

        <div class="event-image">
          <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80" alt="AI 비즈니스 웨비나 이미지">
        </div>

        <div class="info-strip">
          <div class="info-item">
            <span class="info-label">일시</span>
            <span class="info-value">2026.11.20<br>오후 7:00</span>
          </div>
          <div class="info-item">
            <span class="info-label">주제</span>
            <span class="info-value">AI 활용 전략</span>
          </div>
          <div class="info-item">
            <span class="info-label">참석비</span>
            <span class="info-value">무료</span>
          </div>
        </div>
      </div>
    </section>

    <section class="form-panel" aria-label="웨비나 신청 폼">
      <div class="title-row">
        <h2>웨비나 신청</h2>
        <span class="tag">선착순 200명</span>
      </div>

      <form id="webinarForm">
        <div class="row">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" type="text" placeholder="홍길동" required>
          </div>
          <div class="field">
            <label for="job">직무</label>
            <select id="job" required>
              <option value="">선택해주세요</option>
              <option>마케팅</option>
              <option>사업기획</option>
              <option>운영</option>
              <option>디자인</option>
              <option>개발</option>
              <option>기타</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" placeholder="name@example.com" required>
        </div>

        <div class="field">
          <label for="company">회사/소속</label>
          <input id="company" type="text" placeholder="회사명 또는 팀명">
        </div>

        <div class="field">
          <label for="goal">관심 분야</label>
          <textarea id="goal" placeholder="예: AI 기반 마케팅, 서비스 개선, 성장 전략"></textarea>
        </div>

        <label class="checkbox">
          <input type="checkbox" checked>
          <span>웨비나 일정 및 관련 정보를 이메일로 받는 것에 동의합니다.</span>
        </label>

        <button class="submit" type="submit">신청 완료</button>
      </form>

      <div class="meta">
        <span>참석비: 무료</span>
        <span class="status">실시간 접수 중</span>
      </div>

      <div class="success-state" id="successState" aria-live="polite">
        <div class="success-box">
          <div class="success-icon">✓</div>
          <h3>신청 완료</h3>
          <p>웨비나 신청이 정상적으로 접수되었습니다.<br>입력해주신 이메일로 일정 안내를 보내드릴게요.</p>
          <button type="button" id="resetForm">다시 신청하기</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const form = document.getElementById('webinarForm');
    const successState = document.getElementById('successState');
    const resetButton = document.getElementById('resetForm');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      form.style.display = 'none';
      document.querySelector('.meta').style.display = 'none';
      successState.style.display = 'flex';
    });

    resetButton.addEventListener('click', function () {
      form.reset();
      form.style.display = 'grid';
      document.querySelector('.meta').style.display = 'flex';
      successState.style.display = 'none';
    });
  </script>
</body>
</html>
